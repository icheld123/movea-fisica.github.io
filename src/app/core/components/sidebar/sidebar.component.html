<button (click)="isOpen = !isOpen" data-drawer-target="sidebar-multi-level-sidebar" data-drawer-toggle="sidebar-multi-level-sidebar" aria-controls="sidebar-multi-level-sidebar" type="button" class="fixed z-50 inline-flex items-center p-2 -mt-12 ml-6 ms-3 text-xl text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
   <span class="sr-only">Toggle sidebar</span>
   <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
   <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
   </svg>
</button>
<!-- backdrop: visible when sidebar is open -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 z-30" (click)="isOpen = false" aria-hidden="true"></div>

<aside id="sidebar-multi-level-sidebar"
  class="fixed top-0 left-0 z-50 w-64 h-screen transition-transform duration-300 ease-in-out -translate-x-full"
  aria-label="Sidebar"
  [ngClass]="{'translate-x-0': isOpen}">
  <div class="h-full px-3 py-4 overflow-y-auto bg-gray-300">
    <ul class="text-lg mt-10 space-y-2 font-medium">
      <li *ngFor="let modulo of menu">
        <!-- Si tiene hijos: dropdown -->
        <ng-container *ngIf="modulo.children?.length; else simpleLink">
          <button type="button"
            (click)="toggle(modulo.id)"
            class="flex items-center w-full p-2 text-black transition duration-75 rounded-lg group hover:bg-gray-400 hover:text-white"
            [attr.aria-controls]="'dropdown-'+modulo.id">
            <span class="flex-1 text-left whitespace-nowrap">{{ modulo.label }}</span>
            <svg class="w-3 h-3 transition-transform"
              [ngClass]="{'rotate-180': expanded === modulo.id}"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 10 6">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 4 4 4-4" />
            </svg>
          </button>
          <ul id="dropdown-{{modulo.id}}"
            [class.hidden]="expanded !== modulo.id"
            class="py-2 space-y-2">
            <li *ngFor="let child of modulo.children">
              <a [routerLink]="child.path"
                routerLinkActive="bg-gray-400 font-medium"
                (click)="selectModule(modulo.id)"
                class="text-lg flex items-center w-full p-2 text-black transition duration-75 rounded-lg pl-11 group hover:bg-gray-400">
                {{ child.label }}
              </a>
            </li>
          </ul>
        </ng-container>

        <!-- Si NO tiene hijos: enlace directo -->
        <ng-template #simpleLink>
          <a [routerLink]="'/' + modulo.id"
            routerLinkActive="bg-gray-400 font-medium"
            class="flex items-center w-full p-2 text-black transition duration-75 rounded-lg group hover:bg-gray-400">
            {{ modulo.label }}
          </a>
        </ng-template>
      </li>
    </ul>
  </div>
</aside>
