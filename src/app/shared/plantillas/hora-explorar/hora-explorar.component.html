
<div class="flex flex-col items-center min-h-screen text-black">
  <div *ngIf="!modalOpen && data" class="w-full p-8">
    <ng-container *ngIf="data.simulaciones">
      <div class="flex items-center justify-center mb-8 gap-4 flex-wrap">
        <h1 class="text-center text-2xl font-bold mb-6">{{ data.titulo }}</h1>
        <p class="text-center mb-8">{{ data.descripcion }}</p>
        <ng-container *ngFor="let item of data.simulaciones">
          <button
            (click)="openModal(item)"
            class="group relative inline-flex items-center px-6 py-3 text-base font-medium text-white bg-[#8392e0] rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform duration-200 hover:-translate-y-0.5">
            {{ item.titulo }}
            <span class="ml-2 transform group-hover:translate-x-1 transition-transform duration-200">→</span>
          </button>
        </ng-container>
      </div>
    </ng-container>
  </div>

  <app-simulacion
    *ngIf="modalOpen && modalItem"
    [titulo]="modalItem.titulo"
    [descripcion]="modalItem.descripcion"
    [enlace]="modalItem.enlace"
    (volver)="closeModal()"
  ></app-simulacion>
</div>
