<div class="container mx-auto px-4 py-8">

  <!-- Navegación de pestañas -->
  <div class="flex flex-wrap justify-center gap-3 mb-8">
    <button 
      *ngFor="let tab of tabs; let i = index"
      (click)="selectTab(i + 1)"
      class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-200"
      [ngClass]="activeTab === i + 1 
        ? 'bg-[#8392e0] text-white shadow-md' 
        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'"
    >
      {{ tab.titulo }}
    </button>
  </div>

  <!-- Contenido activo -->
  <div *ngIf="data && data[activeTab]" class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
    
    <!-- Descripción y detalles -->
    <div>
      <h3 class="text-xl font-semibold text-blue-700 mb-4">
        {{ data[activeTab].titulo }}
      </h3>

      <p class="text-gray-700 whitespace-pre-line mb-4">
        {{ data[activeTab].descripcion }}
      </p>

      <!-- Items opcionales (como en Flujo) -->
      <div *ngIf="data[activeTab].items" class="space-y-3">
        <div *ngFor="let item of data[activeTab].items" 
             class="bg-white rounded-lg shadow p-4 hover:shadow-md transition">
          <h4 class="font-semibold text-blue-700 mb-1">{{ item.nombre }}</h4>
          <p class="text-gray-700">{{ item.descripcion }}</p>
        </div>
      </div>
    </div>

    <!-- Imagen -->
    <div class="text-center">
      <img 
        [src]="data[activeTab].imagen" 
        alt="Imagen de {{ data[activeTab].titulo }}"
        class="mx-auto rounded-lg shadow-lg w-full max-w-md lg:max-w-lg"
      >
      <p *ngIf="data[activeTab].descripcionImagen" 
         class="text-xs text-gray-400 mt-2 break-words">
        {{ data[activeTab].descripcionImagen }}
      </p>
    </div>
  </div>
</div>
