<div class="plantilla flex flex-col items-center justify-center text-center p-6" [ngStyle]="backgroundStyle" *ngIf="!show_aux">
  <div class="max-w-2xl mx-auto p-10 bg-black/10 rounded-lg backdrop-blur-sm">
    <h2 class="text-3xl font-bold mb-4 text-white">{{ titulo }}</h2>
    <p class="text-lg mb-8 text-gray-200">{{ descripcion }}</p>
    <div *ngIf="textoBoton" class="mt-8 sm:flex sm:items-center sm:justify-center lg:right-10 bottom-1">
      <button (click)="onButtonClick()"
        class="group inline-flex items-center px-6 py-3 text-base font-medium text-white bg-[#8392e0] border border-transparent rounded-full shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:-translate-y-0.5 cursor-pointer">
        <span class="mr-3">{{ textoBoton }}</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </button>
    </div>
  </div>
  <ng-content></ng-content>
</div>
<div class="aux" *ngIf="show_aux">
    <div *ngIf="tituloaux" class="text-center mb-6">
      <h2 class="text-2xl font-bold mb-2">{{tituloaux}}</h2>
    </div>

    <div *ngIf="imagenaux" 
        class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 items-center">

      <div class="text-gray-700">
        <p class="whitespace-pre-line mb-6">{{descripcionaux }}</p>
      </div>

      <div class="text-center">
        <img [src]="imagenaux" 
            class="mx-auto rounded-lg shadow-lg w-full max-w-md lg:max-w-lg">
      </div>

    </div>
    <div class="mt-6 w-full flex lg:justify-end lg:pr-10 sm:justify-center sm:pr-0 ">
      <button (click)="nextSectionButton()"
        class="group relative inline-flex items-center px-6 py-3 text-base font-medium text-white bg-[#8392e0] rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform duration-200 hover:-translate-y-0.5">
        <span class="mr-3">{{ textoBoton }}</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </button>
    </div>
</div>
