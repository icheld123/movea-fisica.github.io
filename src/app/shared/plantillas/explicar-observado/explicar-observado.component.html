<div class="flex flex-col items-center min-h-screen text-black w-full p-8">

  <!--  Tabs dinámicos -->
  <div class="w-full border-b border-gray-300 mb-6 flex justify-center flex-wrap">
    <button
      *ngFor="let section of sections; let i = index"
      (click)="setActiveTab(i)"
      [class.bg-[#8392e0]]="isActive(i)"
      [class.text-white]="isActive(i)"
      [class.text-gray-700]="!isActive(i)"
      class="px-4 py-2 m-1 text-sm font-medium rounded-t-lg transition-colors duration-200 hover:bg-blue-100"
    >
      Sección {{ section.id }}
    </button>
  </div>

  <!-- Contenido de la sección activa -->
  <div *ngIf="sections.length > 0" class="w-full">
    <ng-container *ngIf="sections[activeTabIndex] as activeSection">

      <!-- Caso 1: Sección con título y descripción -->
      <div *ngIf="activeSection.titulo" class="text-center mb-6">
        <h2 class="text-2xl font-bold mb-2">{{ activeSection.titulo }}</h2>
        <p class="text-gray-700 mb-4 whitespace-pre-line">{{ activeSection.descripcion }}</p>
      </div>

      <!-- Caso 1.1: Items (como la sección 1) -->
      <div *ngIf="activeSection.imagen || activeSection.items" 
          class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 items-center">

        <!-- Columna de imagen -->
        <div *ngIf="activeSection.imagen" class="text-center">
          <img [src]="activeSection.imagen" 
              class="mx-auto rounded-lg shadow-lg w-full max-w-md lg:max-w-lg">
          <p *ngIf="activeSection.creditos" 
            class="text-xs text-gray-400 mt-2 break-words">
            {{ activeSection.creditos }}
          </p>
        </div>

        <!-- Columna de items -->
        <div *ngIf="activeSection.items" class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
          <div *ngFor="let item of activeSection.items" 
              class="bg-white rounded-lg shadow p-4 hover:shadow-md transition">
            <h3 class="font-semibold text-blue-700 mb-2">{{ item.nombre }}</h3>
            <p class="text-gray-700 whitespace-pre-line">{{ item.descripcion }}</p>
          </div>
        </div>

      </div>

      <!-- Caso 2: Modales (como la sección 2) -->
      <div *ngIf="activeSection.modales">
        <div *ngFor="let modal of activeSection.modales" class="text-center mb-6">
          <h3 class="text-xl font-semibold mb-3">{{ modal.titulo }}</h3>
          <p class="text-gray-700 mb-6 whitespace-pre-line">{{ modal.descripcion }}</p>

          <div class="flex flex-wrap justify-center gap-3">
            <button
              *ngFor="let boton of modal.botonesModales"
              (click)="openModal(boton)"
              class="px-5 py-2 bg-[#8392e0] text-white rounded-full hover:bg-[#6f7fd0] transition">
              {{ boton.titulo }}
            </button>
          </div>
        </div>
      </div>

      <!-- Caso 3: Transición (como la sección 3) -->
      <div *ngIf="activeSection.transicion" class="text-center">
        <h3 class="text-xl font-semibold mb-3">{{ activeSection.transicion.titulo }}</h3>
        <p class="text-gray-700 mb-6 whitespace-pre-line">{{ activeSection.transicion.descripcion }}</p>

        <button 
          *ngIf="activeSection.transicion.botones?.ruta" 
          [routerLink]="activeSection.transicion.botones.ruta"
          class="px-6 py-2 bg-[#8392e0] text-white rounded-full hover:bg-[#6f7fd0] transition"
        >
          {{ activeSection.transicion.botones.titulo }}
        </button>
      </div>
    </ng-container>
  </div>
</div>

<app-modal 
  [open]="modalOpen" 
  [title]="modalItem?.titulo" 
  [content]="modalItem?.descripcion" 
  [next]="modalItem?.siguiente" 
  [previous]="modalItem?.anterior" 
  [imagen]="modalItem?.imagen" 
  (close)="closeModal()"
  (onNext)="goToNextModal()"
  (onPrevious)="goToPreviousModal()"
></app-modal>
