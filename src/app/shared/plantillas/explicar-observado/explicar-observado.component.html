<div class="flex flex-col items-center min-h-screen text-black">
  <!-- Vista principal o vista de modales: solo una está presente en el DOM -->
  <div *ngIf="data && !showModales" class="w-full p-8">
    <h1 class="text-2xl font-bold mb-6">{{ data.titulo }}</h1>
    <p class="mb-8">{{ data.descripcion }}</p>

    <ng-container *ngIf="layoutType === 'grid'">
      <div class="flex flex-col md:grid md:grid-cols-2 gap-8 mb-8">
        <div *ngIf="data.imagen" class="relative w-full">
          <img [src]="data.imagen" [alt]="data.titulo" class="w-full rounded-lg shadow-lg">
          <p *ngIf="data.creditos" class="text-xs text-gray-400 mt-2 break-words">{{ data.creditos }}</p>
        </div>

        <div class="space-y-6 mt-4 md:mt-0">
          <div *ngFor="let item of data.contenido" class="bg-white/10 rounded-lg p-4">
            <h3 class="font-semibold text-blue-300 mb-2">{{ item.nombre }}</h3>
            <p class="text-black-200">{{ item.descripcion }}</p>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="layoutType === 'lista'">
      <div class="space-y-6">
        <div *ngFor="let item of data.contenido" class="bg-white/10 rounded-lg p-4">
          <h3 class="text-xl font-semibold text-blue-300 mb-2">{{ item.nombre }}</h3>
          <p class="text-gray-200">{{ item.descripcion }}</p>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="layoutType === 'tabs'">
    </ng-container>

    <ng-container *ngIf="layoutType === 'simple'">
      <div class="prose prose-invert max-w-none">
        <div [innerHTML]="data.contenido"></div>
      </div>
    </ng-container>

    <div *ngIf="data.textoBoton" class="absolute right-10 bottom-5">
      <button (click)="onButtonClick()"
        class="group relative inline-flex items-center px-8 py-3 text-lg font-medium text-white bg-[#8392e0] rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 cursor-pointer">
        {{ data.textoBoton }}
        <span class="ml-2 transform group-hover:translate-x-1 transition-transform duration-200">→</span>
      </button>
    </div>
  </div>

  <div *ngIf="data && showModales" id="modales-section" class="w-full p-8">
    <ng-container *ngIf="data.modales && data.modales.length > 0">
      <div class="flex flex-col items-center mb-8 text-center">
        <h1 class="text-2xl font-bold mb-4">{{ data.titulo }}</h1>
        <p class="mb-6">{{ data.descripcion }}</p>
      </div>
      <ng-container *ngFor="let modal of data.modales">
        <div class="flex flex-wrap justify-center gap-4 mb-4">
          <ng-container *ngFor="let item of modal.botonesModales">
            <button
              (click)="openModal(item)"
              class="group relative inline-flex items-center px-6 py-3 text-base font-medium text-white bg-[#8392e0] rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform duration-200 hover:-translate-y-0.5">
              {{ item.titulo }}
            </button>
          </ng-container>
        </div>
      </ng-container>
      <div class="flex flex-wrap justify-center gap-4 mb-4">
        <button
          (click)="goBack()"
          class="group relative inline-flex items-center px-6 py-3 text-base font-medium text-white bg-gray-500 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-transform duration-200 hover:-translate-y-0.5">
          ← Volver
        </button>
      </div>
    </ng-container>
  </div>
</div>


<app-modal 
  [open]="modalOpen" 
  [title]="modalItem?.titulo" 
  [content]="modalItem?.descripcion" 
  [next]="modalItem?.siguiente" 
  [previous]="modalItem?.anterior" 
  [imagen]="modalItem?.imagen" 
  (close)="closeModal()"
  (onNext)="goToNextModal()"
  (onPrevious)="goToPreviousModal()"
></app-modal>
